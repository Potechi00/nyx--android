name: 🔨 Build NYX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          unzip \
          wget \
          m4 \
          autoconf-archive
    
    - name: 🔧 Fix libtool macros
      run: |
        libtoolize --force
        aclocal
        autoreconf -fi
        echo "✅ Libtool macros fixed"
    
    - name: 📦 Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
    
    - name: 🔨 Build Debug APK
      run: |
        buildozer android debug
    
    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nyx-android-debug-apk
        path: bin/*.apk
    
    - name: 📋 Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.1-build-${{ github.run_number }}
        name: "🌑 NYX v0.1 - Build #${{ github.run_number }}"
        body: |
          ## 🔨 Build otomatis
          Download APK & install.
        files: bin/*.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
