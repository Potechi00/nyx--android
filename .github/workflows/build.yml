name: 🔨 Build NYX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          autoconf \
          automake \
          libtool \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          unzip \
          wget
    
    - name: 📦 Install Python Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==3.1.0 buildozer==1.5.0 python-for-android==2024.1.21 virtualenv "sh<2.0"
    
    - name: 🧹 Aggressive Clean Cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer
        rm -rf ~/.cache/pip
        rm -rf ~/.gradle/caches
        rm -rf ~/.python-for-android
        echo "✅ All cache cleared"
    
    - name: 🔨 Build Debug APK
      env:
        USE_CYTHON: "1"
        KIVY_USE_CYTHON: "1"
        PYTHON_FOR_ANDROID_PYTHON_VERSION: "3.14"
      run: |
        export ACLOCAL_PATH=/usr/share/aclocal
        libtoolize --force --copy --install 2>/dev/null || true
        buildozer android debug
    
    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nyx-android-debug-apk
        path: bin/*.apk
    
    - name: 📋 Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.0-build-${{ github.run_number }}
        name: "👑 NYX v3.0 - Build #${{ github.run_number }}"
        body: |
          ## 👑 NYX Goddess of Night Edition
          Download APK & install di HP.
        files: bin/*.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
